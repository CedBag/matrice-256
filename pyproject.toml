[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bokono"
version = "4.2.0"
description = "Bibliothèque algorithmique et ML neuro-symbolique fondée sur la logique binaire du Fâ (Bénin)"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    {name = "Cedoque BAGBONON - Projet Matrice-256", email = "projet.matrice256@protonmail.com"}
]
keywords = ["fa", "benin", "machine-learning", "neuro-symbolic", "bokono", "african-ai", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/CedBag/matrice-256"
Repository = "https://github.com/CedBag/matrice-256"
Documentation = "https://github.com/CedBag/matrice-256/blob/main/docs/whitepaper_matrice256.md"
Issues = "https://github.com/CedBag/matrice-256/issues"

[project.optional-dependencies]
ui = [
    "dash>=2.15.0",
]
benchmark = [
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "codecarbon>=2.3.0",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bokono", "bokono.*"]

[tool.setuptools.package-data]
"bokono.core" = ["fa_knowledge_public.json"]
